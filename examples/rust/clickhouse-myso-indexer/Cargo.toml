[package]
name = "clickhouse-myso-indexer"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# MySo indexer framework dependencies
myso-indexer-alt-framework = { git = "https://github.com/the-social-proof-foundation/myso-core.git", branch = "main" }
myso-indexer-alt-framework-store-traits = { git = "https://github.com/the-social-proof-foundation/myso-core.git", branch = "main" }
myso-types = { git = "https://github.com/the-social-proof-foundation/myso-core.git", branch = "main" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7.10"

# Error handling
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# Command line parsing
clap = { version = "4.0", features = ["derive"] }

# Use .env file
dotenvy = "0.15"

# Future utilities
futures = "0.3"
scoped-futures = "0.1.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# ClickHouse native protocol client (port 9000, faster than HTTP)
clickhouse-native-client = "0.1"

# rustls for crypto provider (optional TLS for ClickHouse)
rustls = { version = "0.23", features = ["ring"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

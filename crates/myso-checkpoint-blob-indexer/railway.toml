[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-checkpoint-blob-indexer/Dockerfile"

[deploy]
healthcheckPath = "/metrics"
healthcheckTimeout = 60
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
# Logging configuration
RUST_LOG = "info,myso_checkpoint_blob_indexer=debug"

# Core MySocial configuration (RPC_API_URL or REST_URL for backward compatibility)
RPC_API_URL = "https://fullnode.testnet.mysocial.network:443"
# gRPC streaming URL - when set, uses gRPC for checkpoint ingestion (primary), remote store fallback
STREAMING_URL = "https://fullnode.testnet.mysocial.network:443"

# Zstd compression level for checkpoint blobs (produces .binpb.zst format expected by downstream consumers)
COMPRESSION_LEVEL = "3"

# S3 bucket the indexer writes checkpoint blobs to (Tigris)
REMOTE_STORE_BUCKET = "checkpoints-archive"
# Public HTTP URL for the same bucket. Used when STREAMING_URL is unset.
REMOTE_STORE_URL = "https://checkpoints-archive.t3.tigrisfiles.io"
# Tigris S3 API. Keys stay in the Railway UI.
AWS_ENDPOINT = "https://t3.storage.dev"
AWS_DEFAULT_REGION = "auto"
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY

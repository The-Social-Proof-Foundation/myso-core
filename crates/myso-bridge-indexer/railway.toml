[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-bridge-indexer/Dockerfile"

[deploy]
healthcheckPath = "/metrics"
healthcheckTimeout = 60
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
# Database Configuration
DATABASE_URL = "${{Postgres.DATABASE_URL}}"

# Logging configuration
RUST_LOG = "info,myso_bridge_indexer=debug"

# Required - RPC endpoints
ETH_RPC_URL = "https://sepolia.base.org"
ETH_WS_URL = "wss://base-sepolia.g.alchemy.com/v2/YOUR_KEY"
MYSO_RPC_URL = "https://fullnode.testnet.mysocial.network:443"

# Required - Bridge config (testnet values)
REMOTE_STORE_URL = "https://storage.googleapis.com/mysocial-testnet-checkpoints"
ETH_MYSO_BRIDGE_CONTRACT_ADDRESS = "0xf2e79b37c734f38a87daf204eb81b1ec81e636bb"
MYSO_BRIDGE_GENESIS_CHECKPOINT = "0"
ETH_BRIDGE_GENESIS_BLOCK = "51899869"

# Optional - defaults in entrypoint
# CONCURRENCY = "500"
# CHECKPOINTS_PATH = ""

[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-analytics-indexer/Dockerfile"

[deploy]
healthcheckPath = "/metrics"
healthcheckTimeout = 60
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
# Logging configuration
RUST_LOG = "info,myso_analytics_indexer=debug"

# Core MySocial configuration (RPC_API_URL or REST_URL for backward compatibility)
RPC_API_URL = "http://fullnode.testnet.mysocial.network:9000"
# gRPC streaming URL - when set, uses gRPC for checkpoint ingestion (primary), HTTP store fallback
STREAMING_URL = "http://fullnode.testnet.mysocial.network:9000"
# Start near chain head to avoid massive backfill (update periodically as chain grows)
FIRST_CHECKPOINT = "770000"
# Pipelines: Checkpoint, Transaction, or comma-separated (e.g. "Checkpoint,Transaction")
PIPELINES = "Checkpoint"

# Processing settings
CHECKPOINT_INTERVAL = "10000"
FILE_FORMAT = "parquet"
MAX_FILE_SIZE_MB = "100"
TIME_INTERVAL_S = "600"

# Google Cloud Storage (REQUIRED) - output bucket for Parquet files
REMOTE_STORE_BUCKET = "mysocial-testnet-analytics"
REMOTE_STORE_REGION = "us"
# HTTP checkpoint store (fallback when streaming, or primary when STREAMING_URL not set)
REMOTE_STORE_URL = "https://storage.googleapis.com/mysocial-testnet-checkpoints"

# GCS Authentication - Set this in Railway UI (not here for security)
# GCS_SERVICE_ACCOUNT_JSON = "{ your service account JSON content }" 
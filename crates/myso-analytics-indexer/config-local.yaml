client_metric_host: "127.0.0.1"
client_metric_port: 9185
# Local `myso start` fullnode RPC and the checkpoint blobs it writes (adjust the path to your network.config dir).
rpc_api_url: "http://127.0.0.1:9000"
local_ingestion_path: "./network.config/data_ingestion"


output_store:
  type: clickhouse
  host: "localhost"
  port: 9100   # ClickHouse native port; 9000 is taken by the local fullnode
  user: "default"

pipelines:
  - pipeline: Transaction
    file_format: parquet
    batch_size:
      rows: 100
    force_batch_cut_after_secs: 5
  - pipeline: Event
    file_format: parquet
    batch_size:
      rows: 100
    force_batch_cut_after_secs: 5
  - pipeline: MoveCall
    file_format: parquet
    batch_size:
      rows: 100
    force_batch_cut_after_secs: 5
  - pipeline: Object
    file_format: parquet
    batch_size:
      rows: 100
    force_batch_cut_after_secs: 5
  - pipeline: BalanceChange
    file_format: parquet
    batch_size:
      rows: 100
    force_batch_cut_after_secs: 5

first_checkpoint: 0

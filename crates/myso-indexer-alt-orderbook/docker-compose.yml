version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: myso-indexer-alt-orderbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderbook
      TIMESCALEDB_TUNE_MAX_CONNECTIONS: "200"
      TIMESCALEDB_TUNE_MAX_MEMORY: "2GB"
    volumes:
      - orderbook_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: ../..
      dockerfile: crates/myso-indexer-alt-orderbook/Dockerfile
    container_name: myso-indexer-alt-orderbook
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENV=testnet
      - PORT=9184
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/orderbook
      - STREAMING_URL=http://fullnode.testnet.mysocial.network:9000
      - RPC_API_URL=http://fullnode.testnet.mysocial.network:9000
      - RUST_LOG=info,myso_indexer_alt_framework=warn,myso_indexer_alt_orderbook=info
    ports:
      - "9184:9184"

  server:
    build:
      context: ../..
      dockerfile: crates/myso-orderbook-server/Dockerfile
    container_name: myso-orderbook-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=9008
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/orderbook
      - RPC_URL=https://fullnode.testnet.mysocial.network:443
      - RUST_LOG=info
    ports:
      - "9008:9008"

volumes:
  orderbook_postgres_data:

[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-indexer-alt-orderbook/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
# Environment (required: mainnet | testnet)
ENV = "testnet"

# Database Configuration
DATABASE_URL = "${{Postgres.DATABASE_URL}}"

# Logging configuration - framework=warn to avoid Railway 500 logs/sec rate limit at startup (50+ pipelines)
RUST_LOG = "info,myso_indexer_alt_framework=warn,myso_indexer_alt_orderbook=info"

# Blockchain Configuration - gRPC for streaming and ingestion fallback
RPC_API_URL = "http://fullnode.testnet.mysocial.network:9000"
STREAMING_URL = "http://fullnode.testnet.mysocial.network:9000"

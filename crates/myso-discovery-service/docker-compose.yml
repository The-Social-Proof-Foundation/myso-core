services:
  discovery-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: discovery
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d discovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  discovery-service:
    build:
      context: ../..
      dockerfile: crates/myso-discovery-service/Dockerfile
    environment:
      DISCOVERY_DATABASE_URL: postgresql://poc:poc@discovery-postgres:5432/discovery
      DISCOVERY_EMBED_ENDPOINT: http://host.docker.internal:8000/internal/discovery/embed
      DISCOVERY_LISTEN: 0.0.0.0:8096
      DISCOVERY_METRICS_ADDRESS: 0.0.0.0:9286
      DISCOVERY_EMBED_ENABLED: "false"
      DISCOVERY_ADMIN_SECRET: ${DISCOVERY_ADMIN_SECRET:-local-discovery-admin}
      RUST_LOG: info
    ports:
      - "8096:8096"
      - "9286:9286"
    depends_on:
      discovery-postgres:
        condition: service_healthy
    # Optional: set DISCOVERY_EMBED_ENABLED=true and DISCOVERY_EMBED_SECRET when PoC
    # is reachable (host.docker.internal:8000). See docs/ARCHITECTURE.md.

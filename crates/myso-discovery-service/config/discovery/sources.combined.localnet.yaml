# Combined factual + creative media corpus for `myso start --with-spot --with-poc`.
# Factual entries feed SPoT settlement registration; media entries feed PoC embed
# (requires DISCOVERY_USE_MANUAL_CURATED=1). Embed gate still requires domain=creative
# and content_kind=media.

# --- Factual (text) ---

- id: coindesk-rss
  adapter_type: rss
  domain: factual
  trust_score: 0.85
  enabled: true
  config:
    feed_urls:
      - https://www.coindesk.com/arc/outboundfeeds/rss/

- id: theblock-rss
  adapter_type: rss
  domain: factual
  trust_score: 0.88
  enabled: true
  config:
    feed_urls:
      - https://www.theblock.co/rss.xml

- id: ethereum-blog-rss
  adapter_type: rss
  domain: factual
  trust_score: 0.90
  enabled: true
  config:
    feed_urls:
      - https://blog.ethereum.org/en/feed.xml

- id: fed-press-rss
  adapter_type: rss
  domain: factual
  trust_score: 0.98
  enabled: true
  config:
    feed_urls:
      - https://www.federalreserve.gov/feeds/press_all.xml

- id: sec-press-rss
  adapter_type: rss
  domain: factual
  trust_score: 0.96
  enabled: true
  config:
    feed_urls:
      - https://www.sec.gov/news/pressreleases.rss

- id: rust-lang-releases
  adapter_type: github_releases
  domain: factual
  trust_score: 0.95
  enabled: true
  config:
    owner: rust-lang
    repo: rust

- id: mystenlabs-sui-releases
  adapter_type: github_releases
  domain: factual
  trust_score: 0.95
  enabled: true
  config:
    owner: MystenLabs
    repo: sui

- id: coingecko-simple-price
  adapter_type: http_official
  domain: factual
  trust_score: 0.90
  enabled: true
  config:
    api_base_url: https://api.coingecko.com/api/v3
    poll_path: /simple/price?ids=bitcoin,ethereum,sui&vs_currencies=usd

- id: coinbase-btc-spot
  adapter_type: http_official
  domain: factual
  trust_score: 0.88
  enabled: true
  config:
    api_base_url: https://api.coinbase.com/v2
    poll_path: /prices/BTC-USD/spot

- id: coinbase-eth-spot
  adapter_type: http_official
  domain: factual
  trust_score: 0.88
  enabled: true
  config:
    api_base_url: https://api.coinbase.com/v2
    poll_path: /prices/ETH-USD/spot

# --- Creative media (PoC embed) ---

- id: curated-public-images
  adapter_type: manual_curated
  domain: creative
  content_kind: media
  trust_score: 0.9
  enabled: true
  entries:
    - url: https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/280px-PNG_transparency_demonstration_1.png
      media_type: image
      title: Wikimedia PNG transparency demo
      creator_x_handle: null
    - url: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Fronalpstock_big.jpg/320px-Fronalpstock_big.jpg
      media_type: image
      title: Wikimedia Fronalpstock sample
      creator_x_handle: null
    - url: https://www.w3.org/People/mimasa/test/imgformat/img/w3c_home.jpg
      media_type: image
      title: W3C home JPEG sample
      creator_x_handle: null

# SPoT oracle trusted-source registration for localnet/dev — REAL fetch targets.
# Factual TEXT settlement registration only. YAML declares where to fetch + enable
# flags + trust scores. TrustedSource adapters perform live HTTP at resolution time.


- id: coindesk-rss
  adapter_type: rss
  domain: factual
  trust_score: 0.85
  enabled: true
  config:
    feed_urls:
      - https://www.coindesk.com/arc/outboundfeeds/rss/


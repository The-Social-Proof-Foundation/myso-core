[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-indexer-alt-graphql/Dockerfile"

[deploy]
# Uses Dockerfile ENTRYPOINT which expands DATABASE_URL and RPC_URL from env
healthcheckPath = "/graphql/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }
DATABASE_URL = { sync = false }
RPC_URL = { sync = false }
CONSISTENT_STORE_URL = { sync = false }
SOCIAL_DATABASE_URL = { sync = false }

[variables]
# Logging configuration  
RUST_LOG = "info,myso_graphql_rpc=debug"
RUST_BACKTRACE = "1" 
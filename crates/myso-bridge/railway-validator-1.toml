[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-bridge/Dockerfile"

[deploy]
startCommand = "sh -c 'set -eu; umask 077; : \"${BRIDGE_AUTHORITY_KEY:?Set the matching authority secret}\"; export BRIDGE_AUTHORITY_KEY_PATH=/tmp/bridge_key_validator_1; export MYSO_RPC_URL=\"${MYSO_RPC_URL:-https://fullnode.testnet.mysocial.network:443}\"; export ETH_RPC_URL=\"${ETH_RPC_URL:-https://sepolia.base.org}\"; export BRIDGE_DB_PATH=\"${BRIDGE_DB_PATH:-/data/bridge-4a7fb537-f2e79b37/client-db}\"; printf '\"'\"'%s'\"'\"' \"$BRIDGE_AUTHORITY_KEY\" > \"$BRIDGE_AUTHORITY_KEY_PATH\"; chmod 600 \"$BRIDGE_AUTHORITY_KEY_PATH\"; : \"${BRIDGE_RELAYER_PRIVATE_KEY:?Set the funded EVM relayer secret}\"; mkdir -p \"$BRIDGE_DB_PATH\"; envsubst '\"'\"'$ETH_RPC_URL $MYSO_RPC_URL $BRIDGE_RELAYER_PRIVATE_KEY $BRIDGE_AUTHORITY_KEY_PATH $BRIDGE_DB_PATH'\"'\"' < /app/bridge-config-validator-1.yaml > /tmp/testnet-bridge-node.yaml; chmod 600 /tmp/testnet-bridge-node.yaml; exec /work/target/release/myso-bridge-node --config-path /tmp/testnet-bridge-node.yaml'"
healthcheckPath = "/ping"
healthcheckTimeout = 300

[deploy.envVars]
PORT = "8080"

[variables]
# Required: Bridge authority private key (Secp256k1) for this validator
# Must be set in Railway environment variables - do not commit to Git
BRIDGE_AUTHORITY_KEY = ""

# Optional: Logging configuration
RUST_LOG = "info,myso_bridge=debug"

# Database Configuration (needed for BridgeClient)
DATABASE_URL = "${{Postgres.DATABASE_URL}}"

# Required: Bridge configuration environment variables
# These are substituted into bridge-config-validator-1.yaml at runtime
# ETH_RPC_URL must be set (contains API keys - do not commit to Git)
ETH_RPC_URL = ""
# ETH_BRIDGE_PROXY_ADDRESS must be set (UPDATED to new deployment)
ETH_BRIDGE_PROXY_ADDRESS = "0xf2e79b37c734f38a87daf204eb81b1ec81e636bb"

# Optional: Override other config values
# MYSO_RPC_URL = "https://fullnode.testnet.mysocial.network:443"

# Bridge Node Configuration
BRIDGE_NODE_PORT = "8080"
BRIDGE_METRICS_PORT = "9090"

# Contract Addresses (Base Sepolia) - UPDATED to new deployment
BRIDGE_COMMITTEE_ADDRESS = "0x1d9cd4c02d93400903c4d976b07aad81da2910d3"
BRIDGE_CONFIG_ADDRESS = "0xe2e5b7df4113367833dd671d64bb5a8628111c53"
BRIDGE_LIMITER_ADDRESS = "0xe425ba13b84a5bb55fdb43052a5d1b9136e83163"
BRIDGE_VAULT_ADDRESS = "0x927436935cb64ebb1fe0628528e21b06528d54f2"

# Bridge Authority Configuration
BRIDGE_COMMITTEE_MEMBER = "true"

# Network Configuration
SOURCE_CHAIN_ID = "12"  # Base Sepolia
TARGET_CHAIN_ID = "2"      # MySo Network

# Monitoring and Logging
LOG_LEVEL = "info"
METRICS_ENABLED = "true"
PROMETHEUS_PORT = "9090"

# Performance Settings
SYNC_BATCH_SIZE = "100"
SYNC_INTERVAL_MS = "5000"
MAX_CONCURRENT_REQUESTS = "10"

# Security Settings
ENABLE_CORS = "true"
TRUSTED_PROXY_COUNT = "1"

# Feature Flags
ENABLE_EMERGENCY_PAUSE = "true"
ENABLE_RATE_LIMITING = "true"
ENABLE_TRANSFER_LIMITS = "true"

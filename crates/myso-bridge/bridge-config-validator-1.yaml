{
  "server-listen-port": 8080,
  "metrics-port": 9090,
  "bridge-authority-key-path": "${BRIDGE_AUTHORITY_KEY_PATH}",
  "run-client": true,
  "approved-governance-actions": [],
  "myso": {
    "myso-rpc-url": "${MYSO_RPC_URL}",
    "myso-bridge-chain-id": 2
  },
  "eth": {
    "eth-rpc-urls": [
      "${ETH_RPC_URL}"
    ],
    "eth-rpc-quorum": 1,
    "eth-bridge-proxy-address": "0xf2e79b37c734f38a87daf204eb81b1ec81e636bb",
    "eth-bridge-chain-id": 12,
    "eth-contracts-start-block-fallback": 51899869
  },
  "db-path": "${BRIDGE_DB_PATH}",
  "deposits": {
    "enabled": true,
    "auto-fund-gas": true,
    "relayer-eth-private-key": "${BRIDGE_RELAYER_PRIVATE_KEY}",
    "supported-tokens": [
      "0x8a9e9Ad05010aD980a1d24b61bC2a099B13D42a2"
    ],
    "poll-interval-secs": 5,
    "evm-confirmation-blocks": 12
  }
}


version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: myso-indexer-alt-social-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mys_social_indexer
      TIMESCALEDB_TUNE_MAX_CONNECTIONS: "200"
      TIMESCALEDB_TUNE_MAX_MEMORY: "2GB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myso-indexer-alt-social
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENV=testnet
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/myso_social_indexer
      - DATABASE_MAX_CONNECTIONS=10
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - CHECKPOINT_URL=https://mysocial-testnet-checkpoints.storage.googleapis.com
      - START_CHECKPOINT=0
      - INDEXER_CONCURRENCY=5
      - RUST_LOG=info,mys_social_indexer=debug
      - PROFILE_PACKAGE_ADDRESS=0x00000000000000000000000000000000000000000000000000000000000050c1
    ports:
      - "8080:8080"

volumes:
  postgres_data:
version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: myso-indexer-alt-social-db:pg17-pg_textsearch
    container_name: myso-indexer-alt-social-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myso_social_indexer
      TIMESCALEDB_TUNE_MAX_CONNECTIONS: "200"
      TIMESCALEDB_TUNE_MAX_MEMORY: "2GB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: ../..
      dockerfile: crates/myso-indexer-alt-social/Dockerfile
    container_name: myso-indexer-alt-social
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENV=testnet
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/myso_social_indexer
      - DATABASE_MAX_CONNECTIONS=10
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - STREAMING_URL=http://fullnode.testnet.mysocial.network:9000
      - RPC_API_URL=http://fullnode.testnet.mysocial.network:9000
      - INDEXER_CONCURRENCY=5
      - RUST_LOG=info,myso_social_indexer=debug
      - PROFILE_PACKAGE_ADDRESS=0x00000000000000000000000000000000000000000000000000000000000050c1
    ports:
      - "8080:8080"

  server:
    build:
      context: ../..
      dockerfile: crates/myso-social-server/Dockerfile
    container_name: myso-social-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=9009
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/myso_social_indexer
      - RUST_LOG=info
    ports:
      - "9009:9009"

volumes:
  postgres_data:

[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-indexer-alt-social/Dockerfile"

[deploy]
startCommand = "/usr/local/bin/entrypoint.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
# Environment (required: mainnet | testnet)
ENV = "testnet"

# Database Configuration
DATABASE_URL = "${{Postgres.DATABASE_URL}}"
DATABASE_PRIVATE_URL = "${{Postgres.DATABASE_PRIVATE_URL}}"
PGDATABASE = "${{Postgres.PGDATABASE}}"
PGHOST = "${{Postgres.PGHOST}}"
PGPASSWORD = "${{Postgres.PGPASSWORD}}"
PGPORT = "${{Postgres.PGPORT}}"
PGUSER = "${{Postgres.PGUSER}}"

# Server Configuration
SERVER_HOST = "0.0.0.0"

# Logging configuration  
RUST_LOG = "info,myso_social_indexer=debug"
RUST_BACKTRACE = "1"

# Blockchain Configuration - gRPC for streaming and ingestion fallback
RPC_API_URL = "http://fullnode.testnet.mysocial.network:9000"
STREAMING_URL = "http://fullnode.testnet.mysocial.network:9000"

# Optional: Start from a specific checkpoint when pipeline has no watermark.
# Set near chain head to catch up (e.g. current_head - 10000). Update as chain grows.
# If Grafana shows 0 checkpoints: 1) Set FIRST_CHECKPOINT near head (uncomment below).
# 2) If resuming from too far back, reset watermark: DELETE FROM watermarks WHERE pipeline = 'social_events';
# 3) Restart the indexer.
# FIRST_CHECKPOINT = "2000000"

# Force migrations on startup
FORCE_MIGRATIONS = "true"
RESET_BLOCKING_SCHEMA = "true"
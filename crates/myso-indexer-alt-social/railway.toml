[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-indexer-alt-social/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
# Environment (required: mainnet | testnet)
ENV = "testnet"

# Database Configuration
DATABASE_URL = "${{Postgres.DATABASE_URL}}"
DATABASE_PRIVATE_URL = "${{Postgres.DATABASE_PRIVATE_URL}}"
PGDATABASE = "${{Postgres.PGDATABASE}}"
PGHOST = "${{Postgres.PGHOST}}"
PGPASSWORD = "${{Postgres.PGPASSWORD}}"
PGPORT = "${{Postgres.PGPORT}}"
PGUSER = "${{Postgres.PGUSER}}"

# Server Configuration
SERVER_HOST = "0.0.0.0"

# Logging configuration  
RUST_LOG = "info,myso_social_indexer=debug"
RUST_BACKTRACE = "1"

# Blockchain Configuration - gRPC for streaming and ingestion fallback
RPC_API_URL = "http://fullnode.testnet.mysocial.network:9000"
STREAMING_URL = "http://fullnode.testnet.mysocial.network:9000"

# Force migrations on startup
FORCE_MIGRATIONS = "true"
RESET_BLOCKING_SCHEMA = "true"
[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-bridge-indexer-alt/Dockerfile"

[deploy]
startCommand = "/usr/local/bin/entrypoint.sh"
healthcheckPath = "/metrics"
healthcheckTimeout = 60
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
# Logging configuration
RUST_LOG = "info,myso_bridge_indexer_alt=debug"

# Postgres - set via Railway Postgres plugin (DATABASE_URL)
# DATABASE_URL = "${{Postgres.DATABASE_URL}}"

# Checkpoint store - only used when STREAMING_URL is not set. When streaming is set, gRPC GetCheckpoint
# is used for ingestion fallback (no remote store needed). Public Tigris URL for .binpb.zst blobs.
REMOTE_STORE_URL = "https://checkpoints-archive.t3.tigrisfiles.io"

# gRPC streaming (optional, for faster ingestion)
STREAMING_URL = "https://fullnode.testnet.mysocial.network:443"

# Fresh genesis: backfill from checkpoint zero on a fresh database.
# Existing database watermarks must belong to this same genesis.
FIRST_CHECKPOINT = "0"

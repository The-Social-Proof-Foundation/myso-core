[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-bridge-indexer-alt/Dockerfile"

[deploy]
startCommand = "/usr/local/bin/entrypoint.sh"
healthcheckPath = "/metrics"
healthcheckTimeout = 60
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
# Logging configuration
RUST_LOG = "info,myso_bridge_indexer_alt=debug"

# Postgres - set via Railway Postgres plugin (DATABASE_URL)
# DATABASE_URL = "${{Postgres.DATABASE_URL}}"

# Checkpoint store - only used when STREAMING_URL is not set. When streaming is set, gRPC GetCheckpoint
# is used for ingestion fallback (no remote store needed). Use mysocial-testnet-archive for .binpb.zst.
REMOTE_STORE_URL = "https://storage.googleapis.com/mysocial-testnet-archive"

# gRPC streaming (optional, for faster ingestion)
STREAMING_URL = "http://fullnode.testnet.mysocial.network:9000"

# Start near chain head to avoid "Outside buffer size" delay. Update periodically.
# For bridge genesis backfill use 43917829; for catch-up use current head minus ~5000.
FIRST_CHECKPOINT = "43917829"

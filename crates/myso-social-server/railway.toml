[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-social-server/Dockerfile"

[deploy]
startCommand = "/usr/local/bin/entrypoint.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
DATABASE_URL = "${{Postgres.DATABASE_URL}}"
RUST_LOG = "info"

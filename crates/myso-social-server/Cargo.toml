[package]
name = "myso-social-server"
version = "0.1.0"
authors = ["The Social Proof Foundation <brandon@socialproof.foundation>"]
license = "Apache-2.0"
publish = false
edition = "2021"

[dependencies]
myso-indexer-alt-social-schema = { path = "../myso-indexer-alt-social-schema" }
myso-indexer-alt-social-reader = { path = "../myso-indexer-alt-social-reader" }
tokio.workspace = true
futures = "0.3.31"
clap = { workspace = true, features = ["env"] }
diesel = { workspace = true, features = ["postgres", "uuid", "chrono", "serde_json", "numeric"] }
diesel-async = { workspace = true, features = ["bb8", "postgres"] }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url.workspace = true
prometheus.workspace = true
myso-futures.workspace = true
myso-indexer-alt-metrics.workspace = true
telemetry-subscribers.workspace = true
axum = { version = "0.7", features = ["json"] }
blake2 = { version = "0.10", features = ["std"] }
hex = "0.4"
http-body-util = "0.1"
myso-crypto.workspace = true
myso-pg-db.workspace = true
myso-sdk-types.workspace = true
tower-http = { version = "0.5", features = ["cors"] }
chrono = "0.4.42"
bigdecimal = "0.4"
thiserror = "1.0"
tracing.workspace = true
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
myso-pg-db = { workspace = true }

[[bin]]
name = "myso-social-server"
path = "src/main.rs"

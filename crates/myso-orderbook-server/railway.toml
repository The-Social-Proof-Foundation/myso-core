[build]
builder = "dockerfile"
dockerfilePath = "crates/myso-orderbook-server/Dockerfile"

[deploy]
healthcheckPath = "/admin/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[deploy.envVars]
PORT = { sync = false }

[variables]
DATABASE_URL = "${{Postgres.DATABASE_URL}}"
RPC_URL = "https://fullnode.testnet.mysocial.network:443"
RUST_LOG = "info"
